[project]
name = "luminary-auth"
version = "1.0.0"
description = "Luminary accounts, skins and an authlib-injector compatible Yggdrasil API for the Luminary Minecraft server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pillow>=10.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
luminary-auth-manage = "luminary_auth.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luminary_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
