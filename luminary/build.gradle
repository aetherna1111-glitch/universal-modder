plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	// repo1 answers where repo.maven.apache.org rate-limits (HTTP 429) behind some proxies; identical content.
	maven { name = 'MavenCentralMirror'; url = 'https://repo1.maven.org/maven2/' }
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// In-world tests (Fabric GameTest), registered as a second mod so they never ship in the jar.
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		luminary { sourceSet sourceSets.main }
		'luminary-gametest' { sourceSet sourceSets.gametest }
	}
	runs {
		gametest {
			server()
			name 'Luminary GameTests'
			source sourceSets.gametest
			vmArg '-Dfabric-api.gametest'
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir 'build/gametest'
		}
		server {
			server()
			name 'Luminary dedicated server (dev)'
			runDir 'run/server'
		}
	}
}

// GameTests assume a fresh civilization state: wipe the previous run's world (vanilla persists <world>/data/luminary.dat).
tasks.named('runGametest') {
	doFirst { delete layout.buildDirectory.dir('gametest/world') }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

test {
	useJUnitPlatform()
	testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
