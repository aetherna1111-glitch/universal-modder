name: luminary
on:
  push:
    paths: ['luminary/**', '.github/workflows/luminary.yml']
  pull_request:
    paths: ['luminary/**', '.github/workflows/luminary.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luminary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests and jar
        run: ./gradlew --no-daemon build
      - name: GameTests (headless server)
        run: ./gradlew --no-daemon runGametest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luminary-build
          path: |
            luminary/build/libs/*.jar
            luminary/build/gametest/junit.xml
            luminary/build/test-results/test/*.xml
